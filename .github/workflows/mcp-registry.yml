name: Publish to MCP Registry

# Run by hand after npm publish: the registry checks that this version exists on npm with the same mcpName.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC login to the registry

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.21
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Take the version from package.json
        run: |
          v="$(jq -r .version package.json)"
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' server.json > "$RUNNER_TEMP/server.json"
          cp "$RUNNER_TEMP/server.json" server.json

      - run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'

      - run: '"$RUNNER_TEMP/mcp-publisher" publish'
